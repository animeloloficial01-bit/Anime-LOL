<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código 0 & animeLol | Hub Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; font-family: 'Poppins', sans-serif; color: white; 
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* --- FONDOS ATMOSFÉRICOS --- */
        .section-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.2; pointer-events: none;
        }

        section {
            position: relative; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        /* --- ESTILO CÓDIGO 0 (TERROR) --- */
        #codigo0 { background: radial-gradient(circle, #1a0000 0%, #000 100%); border-bottom: 2px solid #300; }
        .horror-title { 
            font-family: 'Creepster', cursive; font-size: clamp(3rem, 12vw, 6rem); 
            color: #ff0000; text-shadow: 0 0 20px rgba(255, 0, 0, 0.7); 
            animation: flicker 4s infinite;
        }

        /* --- ESTILO ANIMELOL (ANIME) --- */
        #animelol { background: radial-gradient(circle, #001a33 0%, #000 100%); }
        .anime-title { 
            font-family: 'Orbitron', sans-serif; font-size: clamp(2.5rem, 10vw, 4rem); 
            background: linear-gradient(to right, #00fbff, #ff00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px #00fbff);
        }

        /* --- REPRODUCTOR DE VIDEO --- */
        .video-container {
            width: 100%; max-width: 650px; margin: 30px 0;
            aspect-ratio: 16/9; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden;
        }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* --- BOTONES --- */
        .links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        .btn {
            padding: 15px 30px; border-radius: 5px; text-decoration: none;
            color: white; font-weight: 600; text-transform: uppercase;
            font-size: 0.8rem; letter-spacing: 2px; transition: 0.3s;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        .btn-horror:hover { background: #ff0000; color: #000; box-shadow: 0 0 25px #ff0000; transform: scale(1.05); }
        .btn-anime:hover { background: #00fbff; color: #000; box-shadow: 0 0 25px #00fbff; transform: scale(1.05); border-radius: 40px; }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 22%, 24%, 55% { opacity: 0.4; }
        }

        [data-aos] { opacity: 0; transform: translateY(30px); transition: 1s ease-out; }
        .visible { opacity: 1 !important; transform: translateY(0) !important; }
    </style>
</head>
<body>

    <section id="codigo0">
        <div class="section-bg">
            <iframe src="https://www.youtube.com/embed/Z67Yv8S_fS8?autoplay=1&mute=1&controls=0&loop=1&playlist=Z67Yv8S_fS8" width="100%" height="100%" frameborder="0"></iframe>
        </div>

        <h1 class="horror-title" data-aos>CÓDIGO 0</h1>
        <p style="color:#666; letter-spacing: 5px; font-size: 0.7rem; margin-bottom: 20px;" data-aos>EXPEDIENTES SINIESTROS</p>

        <div class="video-container" data-aos>
            <iframe src="https://www.youtube.com/embed/5w3-e-3Fm_Y?rel=0" allowfullscreen></iframe>
        </div>

        <div class="links" data-aos>
            <a href="https://www.tiktok.com/@codigo_0oficial" target="_blank" class="btn btn-horror">TikTok</a>
            <a href="https://www.facebook.com/share/1b5mJWb9oY/" target="_blank" class="btn btn-horror">Facebook</a>
            <a href="https://youtube.com/@codigo0-of" target="_blank" class="btn btn-horror">YouTube</a>
        </div>
    </section>

    <section id="animelol">
        <div class="section-bg" style="opacity: 0.1;">
            <iframe src="https://www.youtube.com/embed/5U7O0B_q_M4?autoplay=1&mute=1&controls=0&loop=1&playlist=5U7O0B_q_M4" width="100%" height="100%" frameborder="0"></iframe>
        </div>

        <h1 class="anime-title" data-aos>animeLol</h1>
        <p style="color:#00fbff; letter-spacing: 3px; font-size: 0.7rem; margin-bottom: 20px;" data-aos>ANIME & GAMING</p>

        <div class="video-container" data-aos style="border-color: #00fbff;">
            <iframe src="https://www.youtube.com/embed/kR22AonX9Yc?rel=0" allowfullscreen></iframe>
        </div>

        <div class="links" data-aos>
            <a href="https://www.instagram.com/animelol_01" target="_blank" class="btn btn-anime">Instagram</a>
            <a href="https://www.tiktok.com/@animelol01" target="_blank" class="btn btn-anime">TikTok</a>
            <a href="https://m.youtube.com/%40animelolgames01" target="_blank" class="btn btn-anime">YouTube</a>
            <a href="https://www.facebook.com/share/1C8XxeBmQW/" target="_blank" class="btn btn-anime">Facebook</a>
        </div>
    </section>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('[data-aos]').forEach((el) => observer.observe(el));
    </script>

</body>
</html>
